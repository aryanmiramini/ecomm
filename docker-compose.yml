services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    container_name: roider-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ecommerce_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - roider-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/ecommerce_db?schema=public
    container_name: roider-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD}@postgres:5432/ecommerce_db?schema=public
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      ENABLE_OTP: ${ENABLE_OTP:-false}
      ENABLE_PASSWORD_RESET: ${ENABLE_PASSWORD_RESET:-false}
      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY:-}
      KAVENEGAR_SENDER: ${KAVENEGAR_SENDER:-}
      KAVENEGAR_VERIFY_TEMPLATE: ${KAVENEGAR_VERIFY_TEMPLATE:-}
      FRONTEND_URL: ${FRONTEND_PUBLIC_URL:-http://localhost}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      ORDER_TAX_RATE: ${ORDER_TAX_RATE:-0.09}
      ORDER_SHIPPING_FLAT: ${ORDER_SHIPPING_FLAT:-50000}
      ORDER_FREE_SHIPPING_THRESHOLD: ${ORDER_FREE_SHIPPING_THRESHOLD:-500000}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
      MEDIA_PATH: /app/media
      RATE_LIMIT_TTL: ${RATE_LIMIT_TTL:-60}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
      RUN_SEED: ${RUN_SEED:-false}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:-}
      SUPER_ADMIN_PHONE: ${SUPER_ADMIN_PHONE:-}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-}
      SUPER_ADMIN_FIRST_NAME: ${SUPER_ADMIN_FIRST_NAME:-Super}
      SUPER_ADMIN_LAST_NAME: ${SUPER_ADMIN_LAST_NAME:-Admin}
      STORE_FOUNDED_YEAR: ${STORE_FOUNDED_YEAR:-}
    volumes:
      - ./backend/media:/app/media
    networks:
      - roider-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/api/health', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 5
    command: >
      sh -c "
        npx prisma migrate deploy &&
        node dist/main
      "

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-alpine}
        NEXT_PUBLIC_ENABLE_OTP: ${NEXT_PUBLIC_ENABLE_OTP:-false}
        NEXT_PUBLIC_ENABLE_PASSWORD_RESET: ${NEXT_PUBLIC_ENABLE_PASSWORD_RESET:-false}
        NEXT_PUBLIC_ORDER_TAX_RATE: ${ORDER_TAX_RATE:-0.09}
        NEXT_PUBLIC_ORDER_SHIPPING_FLAT: ${ORDER_SHIPPING_FLAT:-50000}
        NEXT_PUBLIC_ORDER_FREE_SHIPPING_THRESHOLD: ${ORDER_FREE_SHIPPING_THRESHOLD:-500000}
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    container_name: roider-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_API_URL: http://backend:3000/api
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1h}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      NODE_ENV: production
      NEXT_PUBLIC_ENABLE_OTP: ${NEXT_PUBLIC_ENABLE_OTP:-false}
      NEXT_PUBLIC_ENABLE_PASSWORD_RESET: ${NEXT_PUBLIC_ENABLE_PASSWORD_RESET:-false}
      NEXT_PUBLIC_ORDER_TAX_RATE: ${ORDER_TAX_RATE:-0.09}
      NEXT_PUBLIC_ORDER_SHIPPING_FLAT: ${ORDER_SHIPPING_FLAT:-50000}
      NEXT_PUBLIC_ORDER_FREE_SHIPPING_THRESHOLD: ${ORDER_FREE_SHIPPING_THRESHOLD:-500000}
    networks:
      - roider-network
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000', (r) => r.statusCode === 200 ? process.exit(0) : process.exit(1))",
        ]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 5

  nginx:
    image: ${NGINX_IMAGE:-docker.arvancloud.ir/library/nginx:1.27-alpine}
    container_name: roider-nginx
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - roider-network

networks:
  roider-network:
    driver: bridge

volumes:
  postgres_data:
